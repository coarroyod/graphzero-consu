<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="32" height="32" role="img" aria-label="graphzero">
  <!-- The mark, flat orange. A favicon is fetched on its own, so nothing the
       page loads is available to it: no webfont, no page stylesheet. Flat
       rather than the prism finish because the prism's blur turns to mud
       below about 24px, which is every size a browser tab uses. -->
  <mask id="m">
    <rect width="96" height="96" fill="#000"/>
    <circle cx="48" cy="40" r="32" fill="#fff"/>
    <rect x="38" y="40" width="20" height="46" rx="5" fill="#fff"/>
    <rect x="38" y="52" width="20" height="22" rx="5" fill="#000"/>
  </mask>
  <rect width="96" height="96" fill="#FF6A00" mask="url(#m)"/>
</svg>
