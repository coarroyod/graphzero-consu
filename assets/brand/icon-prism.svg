<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="graphzero">
  <title>graphzero — prism (primary)</title>
  <defs>
    <mask id="m">
      <rect width="96" height="96" fill="#000"></rect>
      <circle cx="48" cy="40" r="32" fill="#fff"></circle>
      <rect x="38" y="40" width="20" height="46" rx="5" fill="#fff"></rect>
      <rect x="38" y="52" width="20" height="22" rx="5" fill="#000"></rect>
    </mask>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"></feGaussianBlur></filter>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2E93" stop-opacity="0.5"></stop>
      <stop offset="0.2" stop-color="#FF6A00"></stop>
      <stop offset="1" stop-color="#FF8A33"></stop>
    </linearGradient>
  </defs>
  <g mask="url(#m)">
    <rect width="96" height="96" fill="url(#g)"></rect>
    <g filter="url(#soft)">
      <ellipse cx="38" cy="26" rx="22" ry="14" fill="#FFFFFF" fill-opacity="0.5"></ellipse>
      <ellipse cx="62" cy="58" rx="18" ry="14" fill="#FF6A00" fill-opacity="0.95"></ellipse>
    </g>
  </g>
</svg>
